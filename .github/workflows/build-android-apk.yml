name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install dependencies
      run: |
        npm install --legacy-peer-deps --no-audit --no-fund
    
    - name: Build web application
      run: |
        npm run build
        echo "Build completed."
        
    - name: Prepare web assets for Capacitor
      run: |
        # TanStack Start outputs to .output/public but without index.html
        # We need to create index.html that loads the client bundle
        
        mkdir -p dist
        
        if [ -d ".output/public" ]; then
          cp -r .output/public/* dist/
          echo "Copied .output/public to dist"
        fi
        
        # Find the client bundle files
        JS_FILE=$(ls dist/assets/index-*.js 2>/dev/null | head -1 || ls dist/assets/client-*.js 2>/dev/null | head -1)
        CSS_FILE=$(ls dist/assets/styles-*.css 2>/dev/null | head -1)
        
        if [ -z "$JS_FILE" ]; then
          echo "ERROR: Could not find client JS bundle"
          ls -la dist/assets/
          exit 1
        fi
        
        JS_NAME=$(basename "$JS_FILE")
        CSS_NAME=$(basename "$CSS_FILE" 2>/dev/null)
        
        echo "Found JS: $JS_NAME"
        echo "Found CSS: $CSS_NAME"
        
        # Create index.html with proper paths for Capacitor
        # Use relative paths (assets/ not /assets/)
        cat > dist/index.html << HTMLEOF
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <meta name="theme-color" content="#113b22">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <title>Feit</title>
          <link rel="icon" href="favicon.png">
          <link rel="apple-touch-icon" href="apple-touch-icon.png">
          <link rel="manifest" href="manifest.webmanifest">
        HTMLEOF
        
        if [ -n "$CSS_NAME" ]; then
          echo "  <link rel=\"stylesheet\" href=\"assets/$CSS_NAME\">" >> dist/index.html
        fi
        
        cat >> dist/index.html << HTMLEOF
        </head>
        <body>
          <div id="root"></div>
          <script type="module" src="assets/$JS_NAME"></script>
        </body>
        </html>
        HTMLEOF
        
        echo "=== Created index.html ==="
        cat dist/index.html
        
        echo "=== Final dist contents ==="
        ls -la dist/
    
    - name: Setup Capacitor Android platform
      run: |
        npx cap add android || echo "Android platform already exists"
        
        # Copy app icons to Android resources
        mkdir -p android/app/src/main/res/mipmap-mdpi
        mkdir -p android/app/src/main/res/mipmap-hdpi
        mkdir -p android/app/src/main/res/mipmap-xhdpi
        mkdir -p android/app/src/main/res/mipmap-xxhdpi
        mkdir -p android/app/src/main/res/mipmap-xxxhdpi
        
        # Use the PWA icons for Android
        cp dist/icon-192.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png 2>/dev/null || true
        cp dist/icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png 2>/dev/null || true
        cp dist/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png 2>/dev/null || true
        
        # Also create round icons
        cp dist/icon-192.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png 2>/dev/null || true
        cp dist/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png 2>/dev/null || true
        
        npx cap sync android --deployment
    
    - name: Make gradlew executable
      working-directory: ./android
      run: chmod +x gradlew
    
    - name: Build Debug APK
      if: github.event.inputs.build_type != 'release'
      working-directory: ./android
      run: ./gradlew assembleDebug --stacktrace
    
    - name: Build Release APK
      if: github.event.inputs.build_type == 'release'
      working-directory: ./android
      run: ./gradlew assembleRelease --stacktrace
    
    - name: Upload Debug APK
      if: github.event.inputs.build_type != 'release'
      uses: actions/upload-artifact@v4
      with:
        name: feit-app-debug-${{ github.sha }}
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    
    - name: Upload Release APK
      if: github.event.inputs.build_type == 'release'
      uses: actions/upload-artifact@v4
      with:
        name: feit-app-release-${{ github.sha }}
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30
    
    - name: Build summary
      run: |
        echo "### Build completed successfully! 🎉" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build type:** ${{ github.event.inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Download your APK from the Artifacts section above." >> $GITHUB_STEP_SUMMARY
