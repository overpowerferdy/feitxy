name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install dependencies
      run: |
        npm install --legacy-peer-deps --no-audit --no-fund
    
    - name: Build web application
      run: |
        npm run build
        echo "Build completed."
        
    - name: Prepare web assets for Capacitor
      run: |
        # TanStack Start with static preset should output to dist
        echo "=== Checking dist ==="
        ls -la dist/ 2>/dev/null || echo "No dist directory"
        
        echo "=== Checking .output/public ==="
        ls -la .output/public/ 2>/dev/null || echo "No .output/public directory"
        
        # If .output/public exists but dist doesn't, copy it
        if [ -d ".output/public" ] && [ ! -d "dist" ]; then
          mkdir -p dist
          cp -r .output/public/* dist/
          echo "Copied .output/public to dist"
        fi
        
        # Ensure index.html exists
        if [ ! -f "dist/index.html" ]; then
          echo "ERROR: No index.html found in dist"
          ls -la dist/
          exit 1
        fi
        
        echo "=== Final dist contents ==="
        ls -la dist/
    
    - name: Setup Capacitor Android platform
      run: |
        npx cap add android || echo "Android platform already exists"
        npx cap sync android --deployment
    
    - name: Make gradlew executable
      working-directory: ./android
      run: chmod +x gradlew
    
    - name: Build Debug APK
      if: github.event.inputs.build_type != 'release'
      working-directory: ./android
      run: ./gradlew assembleDebug --stacktrace
    
    - name: Build Release APK
      if: github.event.inputs.build_type == 'release'
      working-directory: ./android
      run: ./gradlew assembleRelease --stacktrace
    
    - name: Upload Debug APK
      if: github.event.inputs.build_type != 'release'
      uses: actions/upload-artifact@v4
      with:
        name: feit-app-debug-${{ github.sha }}
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    
    - name: Upload Release APK
      if: github.event.inputs.build_type == 'release'
      uses: actions/upload-artifact@v4
      with:
        name: feit-app-release-${{ github.sha }}
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30
    
    - name: Build summary
      run: |
        echo "### Build completed successfully! 🎉" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build type:** ${{ github.event.inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Download your APK from the Artifacts section above." >> $GITHUB_STEP_SUMMARY
