name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install dependencies
      run: |
        npm install --legacy-peer-deps --no-audit --no-fund
    
    - name: Build web application
      run: |
        npm run build
        echo "Build completed."
        
    - name: Prepare web assets for Capacitor
      run: |
        # TanStack Start outputs to .output/public
        # For Capacitor we need index.html - create it from the SSR build
        mkdir -p dist
        
        if [ -d ".output/public" ]; then
          # Copy all public assets
          cp -r .output/public/* dist/
          
          echo "Copied .output/public to dist"
          ls -la dist/
          
          # Check if index.html exists
          if [ ! -f "dist/index.html" ]; then
            echo "No index.html - TanStack Start SSR build detected"
            echo "Creating index.html that loads the client bundle..."
            
            # Find the main JS and CSS files
            JS_FILE=$(ls dist/assets/index-*.js 2>/dev/null | head -1)
            CSS_FILE=$(ls dist/assets/styles-*.css 2>/dev/null | head -1)
            
            if [ -n "$JS_FILE" ]; then
              JS_NAME=$(basename "$JS_FILE")
              CSS_NAME=$(basename "$CSS_FILE" 2>/dev/null)
              
              cat > dist/index.html << HTMLEOF
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <meta name="theme-color" content="#113b22">
          <title>Feit</title>
          <link rel="stylesheet" href="/assets/${CSS_NAME}">
          <link rel="icon" href="/favicon.png">
        </head>
        <body>
          <div id="root"></div>
          <script type="module" src="/assets/${JS_NAME}"></script>
        </body>
        </html>
        HTMLEOF
              echo "Created index.html"
            else
              echo "ERROR: Could not find client bundle"
              ls -la dist/assets/
              exit 1
            fi
          fi
          
          echo "Final dist contents:"
          ls -la dist/
          cat dist/index.html
        else
          echo "ERROR: .output/public not found"
          ls -la
          exit 1
        fi
    
    - name: Setup Capacitor Android platform
      run: |
        npx cap add android || echo "Android platform already exists"
        npx cap sync android --deployment
    
    - name: Make gradlew executable
      working-directory: ./android
      run: chmod +x gradlew
    
    - name: Build Debug APK
      if: github.event.inputs.build_type != 'release'
      working-directory: ./android
      run: ./gradlew assembleDebug --stacktrace
    
    - name: Build Release APK
      if: github.event.inputs.build_type == 'release'
      working-directory: ./android
      run: ./gradlew assembleRelease --stacktrace
    
    - name: Upload Debug APK
      if: github.event.inputs.build_type != 'release'
      uses: actions/upload-artifact@v4
      with:
        name: feit-app-debug-${{ github.sha }}
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    
    - name: Upload Release APK
      if: github.event.inputs.build_type == 'release'
      uses: actions/upload-artifact@v4
      with:
        name: feit-app-release-${{ github.sha }}
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30
    
    - name: Build summary
      run: |
        echo "### Build completed successfully! 🎉" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build type:** ${{ github.event.inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Download your APK from the Artifacts section above." >> $GITHUB_STEP_SUMMARY
